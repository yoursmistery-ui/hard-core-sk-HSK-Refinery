.zbadge{display:inline-block;padding:2px 9px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap}
.Tag{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:4px;padding:0 5px;font-size:11px;margin:1px;font-family:Consolas,monospace}
.Tag.zone{background:#fef3c7;color:#92400e;font-weight:700}
.flag{color:#b45309;font-weight:600;font-size:12px}
.gc{font-family:Consolas,monospace;color:#0369a1}
.mut{color:var(--muted);font-size:12px}
.mono{font-family:Consolas,monospace;font-size:12px}
.review{background:#fffbeb}
@media(max-width:760px){table,thead,tbody,tr,td{display:block}tr{margin-bottom:8px;border:1px solid var(--line);border-radius:8px;padding:6px}td{border:none}}

const ZONE_CN = {Zone_Underwear:"内衣",Zone_Base:"常服",Zone_Armor:"护甲",Zone_Coat:"大衣",Zone_Head:"头饰",Zone_Face:"面饰",Zone_Accessory:"配饰",Zone_Back:"背具",UNCLASSIFIED:"未知"};
const ZONE_STYLE = {Zone_Underwear:"--z1",Zone_Base:"--z2",Zone_Armor:"--z3",Zone_Coat:"--z4",Zone_Head:"--z5",Zone_Face:"--z6",Zone_Accessory:"--z7",Zone_Back:"--z8",UNCLASSIFIED:"--z3"};
function zb(z){const v=ZONE_STYLE[z]||"--z6";return `<span class="zbadge" style="background:var(${v});color:var(${v}f)">${(ZONE_CN[z]||z)}</span>`}
let zones=new Set(), sortK="proposedZone", sortD=1;
const mods=[...new Set(DATA.map(r=>r.mod))].sort();
document.getElementById("modSel").innerHTML+=mods.map(m=>`<option>${m}</option>`).join("");
const zc=document.getElementById("zoneChips");
const zcount={}; DATA.forEach(r=>zcount[r.proposedZone]=(zcount[r.proposedZone]||0)+1);
Object.keys(ZONE_CN).filter(z=>zcount[z]).forEach(z=>{
  const c=document.createElement("span");c.className="chip on";c.dataset.z=z;
  c.innerHTML=`${zb(z)}<span class="n">${zcount[z]}</span>`;
  c.onclick=()=>{c.classList.toggle("on");zones.has(z)?zones.delete(z):zones.add(z);render()};
  zc.appendChild(c);
});
zones=new Set(Object.keys(zcount));
let th=document.createElement("th");
document.querySelectorAll("th[data-k]").forEach(h=>h.onclick=()=>{sortD=(sortK===h.dataset.k?-sortD:1);sortK=h.dataset.k;render()});
function render(){
  const q=document.getElementById("q").value.toLowerCase();
  const mf=document.getElementById("modSel").value, ff=document.getElementById("flagSel").value;
  let rows=DATA.filter(r=>zones.has(r.proposedZone)
    &&(!mf||r.mod===mf)&&(!ff||r.reviewFlag)
    &&(!q||(r.defName+" "+r.label+" "+r.tags).toLowerCase().includes(q)));
  rows.sort((a,b)=>(a[sortK]||"").localeCompare(b[sortK]||"","zh")*sortD);
  document.getElementById("count").textContent=rows.length+" / 347 件";
  document.getElementById("tb").innerHTML=rows.map(r=>{
    const tags=(r.tags||"").split("|").filter(t=>t).map(t=>`<span class="Tag${t.startsWith("Zone_")?" zone":""}">${t.replace("Zone_","")}</span>`).join("");

}
document.getElementById("q").oninput=render;
document.getElementById("modSel").onchange=render;
document.getElementById("flagSel").onchange=render;
